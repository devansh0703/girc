name: Pages

on:
  push:
    branches: [master]
    paths:
      - "web/girc-site/**"
      - "tools/generate_figures.py"
      - "tools/generate_report.py"
      - "tools/assemble_site.py"
      - "tools/check_site_links.py"
      - "tools/check_design_contract.py"
      - "research/benchmark/**"
      - "models/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The deployment is the point of this workflow, so the whole job is
# serialised: a second push waits rather than racing the first.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The address the hosted analysis is served on. It is a repository setting
  # rather than a secret, and it is substituted into the pages when they are
  # assembled.
  GIRC_PORTAL_URL: https://girc-portal.onrender.com

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip

      # The figures are generated from the committed artifacts, so the build
      # fails when an artifact is missing rather than shipping a page with a
      # blank where a measurement belongs.
      - name: Generate every figure
        run: python3 tools/generate_figures.py

      - name: Check that every page links to a page that exists
        run: python3 tools/check_site_links.py

      - name: Check the site against the design contract
        run: python3 tools/check_design_contract.py

      - name: Assemble the site
        run: |
          python3 tools/assemble_site.py
          # The site uses relative links throughout, so it works under a
          # project path without a base tag. The .nojekyll file keeps GitHub
          # Pages from running the directory through Jekyll.
          touch build/site/.nojekyll

      - name: Check that no built page carries an invented address
        run: |
          # A demo address on a product site is a message nobody receives.
          if grep -rniE 'example\.com|example\.org|@example\.|\.invalid|lorem ipsum|coming soon' \
               build/site --include='*.html'; then
            echo "::error::a built page carries a placeholder"
            exit 1
          fi
          if ! grep -rq 'devanshraulo@gmail.com' build/site --include='*.html'; then
            echo "::error::the site does not name the real contact address"
            exit 1
          fi
          echo "the real address is the only contact detail on the site"

      - name: Check that every page carries at least two figures
        run: |
          # The site's own rule: a page with no figure is a page that asks to
          # be trusted rather than checked.
          python3 - <<'PY'
          import pathlib, re, sys
          failed = False
          for page in sorted(pathlib.Path("build/site").rglob("*.html")):
              found = len(re.findall(r'<figure class="chart"', page.read_text(encoding="utf-8")))
              if found < 2:
                  print(f"{page}: {found} figure(s)")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
