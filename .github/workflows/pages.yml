name: Pages

on:
  push:
    branches: [master]
    paths:
      - "web/girc-site/**"
      - "web/eval-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The deployment is the point of this workflow, so the whole job is
# serialised: a second push waits rather than racing the first.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The address the confidential portal is served on. It is a
  # repository setting rather than a secret, and it is substituted
  # into the evaluation site's pages when they are assembled.
  GIRC_PORTAL_URL: https://eval.girc.invalid

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that every page links to a page that exists
        run: |
          python3 tools/check_site_links.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R web/girc-site/. _site/
          # The evaluation site's pages are the public face of the
          # confidential portal: what the evaluation is, how it runs,
          # and what is out of scope. They are deployed under
          # /evaluate/, and the portal itself is a separate
          # deployment with its own domain and its own secrets.
          mkdir -p _site/evaluate
          cp -R web/eval-site/. _site/evaluate/
          # The portal's address is a deployment setting, so the pages
          # carry a token and the real address is substituted here.
          PORTAL_URL="${GIRC_PORTAL_URL:-https://eval.girc.invalid}"
          find _site/evaluate -name '*.html' -print0 \
            | xargs -0 sed -i "s|{{PORTAL_URL}}|$PORTAL_URL|g"
          # The site uses relative links throughout, so it works under a
          # project path without a base tag. The .nojekyll file keeps
          # GitHub Pages from running the directory through Jekyll.
          touch _site/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
