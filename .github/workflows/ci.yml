name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/portal/requirements.txt') }}

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/portal/requirements.txt
          pip install -r python/girc-train/requirements.txt

      - name: Test the evaluation portal
        env:
          PYTHONPATH: apps/portal
        run: pytest apps/portal/tests -q

  transform-oracle:
    name: Transform oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install the native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Install Python and NumPy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip && pip install numpy

      - name: Build VVenC
        run: |
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/fraunhoferhhi/vvenc.git data/tools/vvenc-src
          # One build, with tracing enabled, because the syntax check
          # needs it and building twice does not fit in the runner's
          # time. Tracing does not change what the encoder produces.
          cmake -S data/tools/vvenc-src -B data/tools/vvenc-src/build \
            -DCMAKE_BUILD_TYPE=Release -DVVENC_ENABLE_TRACING=1
          cmake --build data/tools/vvenc-src/build --config Release -j 2

      - name: Generate the reference vectors
        run: |
          ./tools/generate_transform_oracle.sh
          ./tools/generate_chroma_qp_oracle.sh

      - name: Check the transforms against VVenC
        run: cargo test -p girc-core transform

      - name: Check the chroma QP mapping against VVenC
        run: cargo test -p girc-core chroma_qp

      - name: Check the transform signalling against VVenC
        run: python3 tools/check_mts_syntax.py

  prior-art:
    name: Prior art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that every quotation is in the claim text
        run: python3 tools/verify_claim_charts.py

      - name: Check that the documents agree with the benchmark
        run: |
          # The benchmark report is committed, so the figures the
          # documents quote can be checked against the run they came
          # from rather than trusted.
          python3 tools/verify_benchmark_numbers.py research/benchmark/report-v9-joint.json

  sites:
    name: Sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip

      - name: Check that every page links to a page that exists
        run: |
          python3 tools/check_site_links.py

      - name: Generate every figure from the committed artifacts
        run: |
          # The figures are generated rather than drawn, so a build without
          # the artifacts that produce them fails here rather than shipping a
          # page with a blank where a measurement belongs.
          python3 tools/generate_figures.py
          python3 tools/generate_report.py

      - name: Check the site against the design contract
        run: |
          python3 tools/check_design_contract.py

      - name: Assemble the site and check the figures resolve
        run: |
          python3 tools/assemble_site.py

      - name: Check that no built page carries an invented address
        run: |
          # A demo address on a product site is a message nobody receives.
          if grep -rniE 'example\.com|example\.org|@example\.|\.invalid|lorem ipsum|coming soon' \
               build/site --include='*.html'; then
            echo "::error::a built page carries a placeholder"
            exit 1
          fi
          # The real address is the only contact detail on the site.
          if ! grep -rq 'devanshraulo@gmail.com' build/site --include='*.html'; then
            echo "::error::the site does not name the real contact address"
            exit 1
          fi
          echo "the real address is the only contact detail on the site"

      - name: Check that the report was regenerated and not hand-edited
        run: |
          # The report is generated, so a committed report that differs from
          # the generated one is a report somebody edited by hand.
          if ! git diff --quiet -- research/REPORT.md; then
            git diff --stat -- research/REPORT.md
            echo "::error::research/REPORT.md is generated; commit the regenerated version"
            exit 1
          fi
          echo "the report is the generated one"

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the compose file
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config

      - name: Check the shell scripts
        run: |
          for script in deploy/*.sh; do
            bash -n "$script"
            echo "$script parses"
          done

      - name: Check the container image builds
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example build portal

      - name: Check the portal answers in the container
        run: |
          # The database refuses an empty password, so the example
          # environment file is given real values for this run. They
          # are throwaway: the stack is torn down at the end.
          cp deploy/.env.example deploy/.env.ci
          {
            echo "GIRC_DB_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
            echo "GIRC_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          } >> deploy/.env.ci

          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci \
            up -d db portal
          for _ in $(seq 1 40); do
            if docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci \
                exec -T portal \
                python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" 2>/dev/null; then
              echo "the portal answers"
              break
            fi
            sleep 3
          done
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci logs --tail 40 portal
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci \
            exec -T portal \
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
          echo "the portal answers and the schema was created"

          # The schema really is in the database, not just in the
          # portal's memory.
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci \
            exec -T db psql -U girc_eval -d girc_eval -c "\\dt"

          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci down -v
          rm -f deploy/.env.ci
