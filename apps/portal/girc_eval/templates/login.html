{% extends "base.html" %}
{% block title %}Sign in — GIRC Evaluate{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block body %}
<div class="readout">SIGN IN</div>
<h1>Sign in</h1>
<form method="post" action="/login" data-json="true">
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="username" />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required
           autocomplete="current-password" />
  </div>
  <button class="btn primary" type="submit">Sign in</button>
</form>
<p class="muted" style="margin-top:1.5rem">
  No account yet? <a href="/register">Register your organisation</a>.
</p>
{% endblock %}
