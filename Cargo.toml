[workspace]
resolver = "2"
members = ["crates/girc-core", "crates/girc-cli", "crates/girc-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/devansh0703/girc"
authors = ["girc contributors"]

[workspace.dependencies]
girc-core = { path = "crates/girc-core" }
constriction = "0.5.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
