#
# The service's own manifest. Render reads this file directly, so the deployed
# configuration is in the repository rather than only in a dashboard: what is
# running can be compared with what is committed.
#
# One service, on purpose. A Render workspace gets 750 free instance hours per
# calendar month across every free service, and a month is 730-744 hours, so
# exactly one always-on free service fits. Everything the hosted product does
# lives on this one instance rather than being split across several.
#
# The runtime is native python rather than Docker, and the difference matters:
# free web services cannot run Docker deploys at all (they fail in seconds),
# and the free build plan has too little memory to compile the Rust codec
# anyway. So the build command downloads the binary CI published from the same
# commit -- the `codec-linux` release asset, uploaded by the Rust job in
# .github/workflows/ci.yml -- and the service runs it. The measurement over
# HTTP is the measurement the command line produces, because it is the same
# binary, and the deployed code and the deployed codec come from one push.
#
# No env vars are set here: Render provides PORT itself, and the service's own
# defaults point at target/release/girc and models/girc-predictor.json, both
# of which the build command places. GIRC_CLI and GIRC_MODEL exist for a
# deployment that puts them elsewhere.
services:
  - type: web
    name: girc-portal
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /health
    branch: master
    autoDeploy: true
    buildCommand: >
      mkdir -p target/release &&
      curl -fsSL -o target/release/girc
      https://github.com/devansh0703/girc/releases/download/codec-linux/girc
      && chmod +x target/release/girc
      && pip install -r apps/portal/requirements.service.txt
    startCommand: PYTHONPATH=apps/portal python3 -m girc_eval.service
